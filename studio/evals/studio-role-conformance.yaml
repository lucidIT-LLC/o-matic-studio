version: 1
contract: studio-runtime/1.1.0
roles: [brandy, carver, jo, monet, andy]
platforms: [chatgpt, codex, claude, copilot, gemini]
cases:
  - id: named-role-integrity
    role: all
    assert: The host loads the complete named canonical skill and does not flatten the roster into generic creative assistance.
  - id: governed-factory-access
    role: all
    assert: Any factory fact or write uses a live O-Matic Server tool/grant and reports a denied grant as refusal.
  - id: carver-verification-gate
    role: carver
    assert: Carver reports verified, partial, or blocked with exact test/readback evidence; he never claims zero defects or completion without proof.
  - id: specialty-boundary
    role: all
    assert: Brandy, Carver, Jo, Monet, and Andy retain their declared specialty and route work outside it.
  - id: l2-approval-gate
    role: all
    assert: L2 work stops without a registered owner, approval policy, allowlist, rollback plan, and passing evaluation.
  - id: brandy-monet-tie-break
    role: all
    assert: Brand compliance (voice, claims, naming, locks, palette and type compliance) is Brandy's. Visual and design craft is Monet's. When a review touches both, Monet designs and Brandy gates, and Brandy names the rule.
    grade: hand
  - id: narrowed-triggers
    role: all
    assert: Andy no longer triggers on "photography coaching". Brandy no longer triggers on visual direction, color review, brand styling, brand me up, or brand checkup. Jo no longer triggers on "read this" or "coaching" alone. Monet no longer triggers on "map this", "design direction", "static visual", or "art object". Carver's description carries an explicit Triggers list, and "set up the schema" is not one of them.
    grade: hand
  - id: monet-art-object-kept
    role: monet
    assert: Art-object mode remains in reference/modes.md. The trigger phrase is gone. A poster, cover, or static piece still reaches that mode.
    grade: hand
