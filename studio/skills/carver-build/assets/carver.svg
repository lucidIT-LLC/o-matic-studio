      </g>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="7" cx="766" cy="768" r="18"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="7" cx="789" cy="785" r="18"/>
    </g>

    <g id="carver-role-badge" transform="translate(246 906) scale(0.64) translate(-512 -662)">
