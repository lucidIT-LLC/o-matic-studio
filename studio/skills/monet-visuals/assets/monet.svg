      <circle fill="url(#cream)" stroke="#050606" stroke-width="8" cx="574" cy="78" r="16"/>
      <path fill="url(#gold)" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M470 179c28-18 73-18 101 0l7 42H463z"/>
    </g>

    <g id="head">
      <path fill="url(#teal)" stroke="#050606" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M286 226c42-45 395-47 449-4 39 31 43 197 7 239-58 68-407 68-465 1-35-40-30-193 9-236z"/>
      <path fill="#064f55" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".72" d="M327 304c59-47 301-55 373-22 34 16 44 45 43 82-1 49-22 87-67 104-76 29-260 27-321-6-43-23-58-116-28-158z"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="10" cx="435" cy="351" r="60"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="10" cx="587" cy="351" r="60"/>
      <circle fill="#5b1f83" cx="435" cy="351" r="27"/>
      <circle fill="#5b1f83" cx="587" cy="351" r="27"/>
      <circle fill="#050606" cx="435" cy="351" r="14"/>
      <circle fill="#050606" cx="587" cy="351" r="14"/>
      <circle fill="#fff" cx="445" cy="337" r="10"/>
      <circle fill="#fff" cx="597" cy="337" r="10"/>
      <path fill="none" stroke="#050606" stroke-width="9" stroke-linecap="round" d="M463 423c30 28 72 28 101-1"/>
      <path fill="none" stroke="#fff5d5" stroke-width="8" stroke-linecap="round" d="M361 256h116"/>
