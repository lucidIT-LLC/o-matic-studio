        <rect fill="#20a8a0" stroke="#050606" stroke-width="6" x="17" y="18" width="116" height="90" rx="8"/>
        <rect fill="#ffc928" x="35" y="66" width="16" height="28" rx="3"/>
        <rect fill="#df67df" x="60" y="49" width="16" height="45" rx="3"/>
        <rect fill="#8b35bd" x="85" y="35" width="16" height="59" rx="3"/>
        <rect fill="#f5f2e8" x="110" y="56" width="16" height="38" rx="3"/>
      </g>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="7" cx="763" cy="774" r="18"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="7" cx="790" cy="788" r="18"/>
    </g>

    <g id="monet-role-badge" transform="translate(272 872) scale(0.54) translate(-512.5 -666)">
