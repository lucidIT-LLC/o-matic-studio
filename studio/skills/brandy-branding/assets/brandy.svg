<svg viewBox="84 69 941 941" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Brandy O-Matic Robot Vector</title>
  <desc id="desc">Affinity-safe editable vector of Brandy, O-Matic brand guardian, based on the rounded O-Matic robot model with palette, brush, sunrise badge, and teal ribbon. Task #751 (2026-09-28, Monet): chest O-ring restored from the registered master brand/omatic-robot-vector-no-bg.svg (sha256 837fbc0156a023ec) at its own geometry, gold r66 + teal r35 at 510,658; palette rebound to the master's gradients per decision #522; the role instrument moved off the chest per brand_messaging #120; no red on the robot (color.alert).</desc>
